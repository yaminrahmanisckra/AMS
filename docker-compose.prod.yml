version: '3.8'

services:
  academic-management:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: academic-management-system-prod
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-here}
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./instance:/app/instance
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: academic-management-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - academic-management
    restart: unless-stopped
    networks:
      - app-network

  # Optional: PostgreSQL database
  # postgres:
  #   image: postgres:15
  #   container_name: academic-management-db
  #   environment:
  #     - POSTGRES_DB=academic_management
  #     - POSTGRES_USER=${DB_USER:-admin}
  #     - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   restart: unless-stopped
  #   networks:
  #     - app-network

networks:
  app-network:
    driver: bridge

