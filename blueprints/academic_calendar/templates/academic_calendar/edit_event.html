{% extends "base.html" %}

{% block title %}Edit Event - Academic Calendar{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="fas fa-edit me-2"></i>Edit Calendar Event</h5>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="title" class="form-label">Title <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="title" name="title" value="{{ event.title }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description" rows="3">{{ event.description or '' }}</textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label for="event_date" class="form-label">Start Date <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" id="event_date" name="event_date" value="{{ event.event_date.strftime('%Y-%m-%d') }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="end_date" class="form-label">End Date (Optional)</label>
                            <input type="date" class="form-control" id="end_date" name="end_date" value="{{ event.end_date.strftime('%Y-%m-%d') if event.end_date else '' }}">
                            <small class="form-text text-muted">Leave empty for single day events. If provided, event will span from start date to end date.</small>
                        </div>
                        
                        <div class="mb-3">
                            <label for="event_type" class="form-label">Event Type</label>
                            <select class="form-select" id="event_type" name="event_type">
                                <option value="event" {% if event.event_type == 'event' %}selected{% endif %}>Event</option>
                                <option value="holiday" {% if event.event_type == 'holiday' %}selected{% endif %}>Holiday</option>
                                <option value="exam" {% if event.event_type == 'exam' %}selected{% endif %}>Exam</option>
                                <option value="meeting" {% if event.event_type == 'meeting' %}selected{% endif %}>Meeting</option>
                                <option value="deadline" {% if event.event_type == 'deadline' %}selected{% endif %}>Deadline</option>
                                <option value="semester_start" {% if event.event_type == 'semester_start' %}selected{% endif %}>Semester Start Date</option>
                                <option value="semester_end" {% if event.event_type == 'semester_end' %}selected{% endif %}>Semester End Date</option>
                            </select>
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-2"></i>Update Event
                            </button>
                            <a href="{{ url_for('academic_calendar.index') }}" class="btn btn-secondary">
                                <i class="fas fa-times me-2"></i>Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
