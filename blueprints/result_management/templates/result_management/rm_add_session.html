{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4><i class="bi bi-plus-circle-fill me-2"></i>Add New Session</h4>
        </div>
        <div class="card-body">
            <form method="post">
                <div class="mb-3">
                    <label for="name" class="form-label">Academic Session<span class="text-danger">*</span></label>
                    <select class="form-select" id="name" name="name" required>
                        <option value="">Select Session</option>
                        {% for option in session_options %}
                        <option value="{{ option }}" {% if option == selected_session %}selected{% endif %}>{{ option }}</option>
                        {% endfor %}
                    </select>
                    {% if not session_options %}
                    <div class="form-text text-danger">No active semester found. Configure Active Semester first.</div>
                    {% endif %}
                </div>
                <div class="mb-3">
                    <label for="year" class="form-label">Year</label>
                    <select class="form-select" id="year" name="year">
                        <option value="">Select Year</option>
                        {% if session_year_term_options %}
                        {% for row in session_year_term_options %}
                        <option value="{{ row.year }}" data-session="{{ row.academic_session }}" {% if row.year == selected_year %}selected{% endif %}>{{ row.year or '—' }}</option>
                        {% endfor %}
                        {% else %}
                        {% for option in year_options %}
                        <option value="{{ option }}" {% if option == selected_year %}selected{% endif %}>{{ option }}</option>
                        {% endfor %}
                        {% endif %}
                    </select>
                </div>
                <div class="mb-3">
                    <label for="term" class="form-label">Term<span class="text-danger">*</span></label>
                    <select class="form-select" id="term" name="term" required>
                        <option value="">Select Term</option>
                        {% if session_year_term_options %}
                        {% for row in session_year_term_options %}
                        <option value="{{ row.term }}" data-session="{{ row.academic_session }}" data-year="{{ row.year }}" {% if row.term == selected_term %}selected{% endif %}>{{ row.term }}</option>
                        {% endfor %}
                        {% else %}
                        {% for option in term_options %}
                        <option value="{{ option }}" {% if option == selected_term %}selected{% endif %}>{{ option }}</option>
                        {% endfor %}
                        {% endif %}
                    </select>
                </div>
                <button type="submit" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Add Session</button>
                <a href="{{ url_for('result_management.index') }}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Back to Sessions</a>
            </form>
        </div>
    </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function () {
    const sessionSelect = document.getElementById('name');
    const yearSelect = document.getElementById('year');
    const termSelect = document.getElementById('term');
    if (!sessionSelect || !yearSelect || !termSelect) return;

    const hasSessionBoundOptions = yearSelect.querySelector('option[data-session]') || termSelect.querySelector('option[data-session]');
    if (!hasSessionBoundOptions) return;

    function filterYearOptions() {
        const selectedSession = sessionSelect.value;
        const options = yearSelect.querySelectorAll('option');
        options.forEach(opt => {
            if (!opt.value) {
                opt.style.display = 'block';
                return;
            }
            const match = opt.dataset.session === selectedSession;
            opt.style.display = match ? 'block' : 'none';
        });
        if (yearSelect.value) {
            const selectedOption = yearSelect.querySelector(`option[value="${yearSelect.value}"]`);
            if (!selectedOption || selectedOption.style.display === 'none') {
                yearSelect.value = '';
            }
        }
    }

    function filterTermOptions() {
        const selectedSession = sessionSelect.value;
        const selectedYear = yearSelect.value;
        const options = termSelect.querySelectorAll('option');
        options.forEach(opt => {
            if (!opt.value) {
                opt.style.display = 'block';
                return;
            }
            const sessionMatch = opt.dataset.session === selectedSession;
            const yearMatch = (opt.dataset.year || '') === (selectedYear || '');
            opt.style.display = (sessionMatch && yearMatch) ? 'block' : 'none';
        });
        if (termSelect.value) {
            const selectedOption = termSelect.querySelector(`option[value="${termSelect.value}"]`);
            if (!selectedOption || selectedOption.style.display === 'none') {
                termSelect.value = '';
            }
        }
    }

    sessionSelect.addEventListener('change', function () {
        yearSelect.value = '';
        termSelect.value = '';
        filterYearOptions();
        filterTermOptions();
    });

    yearSelect.addEventListener('change', function () {
        termSelect.value = '';
        filterTermOptions();
    });

    filterYearOptions();
    filterTermOptions();
});
</script>
{% endblock %}
