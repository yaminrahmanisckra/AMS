{% extends "base.html" %}
{% block title %}New syllabus – Curriculator{% endblock %}

{% block mobile_title %}New Doc{% endblock %}
{% block content %}
<div class="container my-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{{ url_for('curriculator.index') }}">Curriculator</a></li>
            <li class="breadcrumb-item active">New syllabus</li>
        </ol>
    </nav>
    <h2 class="mb-4"><i class="fas fa-plus me-2"></i>Create syllabus</h2>
    <div class="card shadow-sm" style="max-width: 540px;">
        <div class="card-body">
            <form method="post" action="{{ url_for('curriculator.document_create') }}">
                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" class="form-control" id="name" name="name" required
                           placeholder="e.g. LLB Curriculum (Revised 7 Feb 2023)">
                </div>
                <div class="mb-3">
                    <label for="applicable_batches" class="form-label">Applicable batches (optional)</label>
                    <input type="text" class="form-control" id="applicable_batches" name="applicable_batches"
                           placeholder="e.g. 2022, 2023">
                </div>
                <button type="submit" class="btn btn-primary">Create</button>
                <a href="{{ url_for('curriculator.index') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
