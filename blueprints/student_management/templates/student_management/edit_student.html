{% extends "base.html" %}

{% block title %}Edit Student{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">
                        <i class="fas fa-user-edit me-2"></i>Edit Student
                    </h5>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="student_id" class="form-label">
                                Student ID <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control" id="student_id" name="student_id" 
                                   value="{{ student.student_id }}" required>
                            <small class="form-text text-muted">Unique identifier for the student</small>
                        </div>

                        <div class="mb-3">
                            <label for="name" class="form-label">
                                Name <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control" id="name" name="name" 
                                   value="{{ student.name }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="batch" class="form-label">Batch</label>
                            <input type="text" class="form-control" id="batch" name="batch" 
                                   value="{{ student.batch or '' }}" placeholder="e.g. 2021">
                        </div>

                        <div class="mb-3">
                            <label for="hall" class="form-label">Hall</label>
                            <input type="text" class="form-control" id="hall" name="hall" 
                                   value="{{ student.hall or '' }}" placeholder="e.g. Khan Jahan Ali Hall">
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" 
                                   value="{{ student.email or '' }}" placeholder="student@example.com">
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label">Phone Number</label>
                            <input type="text" class="form-control" id="phone" name="phone" 
                                   value="{{ student.phone or '' }}" placeholder="e.g. +8801712345678">
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i>Update Student
                            </button>
                            <a href="{{ url_for('student_management.index') }}" class="btn btn-secondary">
                                <i class="fas fa-times me-1"></i>Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
